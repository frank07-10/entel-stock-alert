name: Notificacion de prueba

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enviar prueba a ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sf -H "Title: Prueba alerta Xiaomi" -H "Tags: white_check_mark" -H "Priority: urgent" \
            -d "Si ves esto, las alertas de precio del Robot Vacuum 6 Max y 6 Pro funcionan." \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
